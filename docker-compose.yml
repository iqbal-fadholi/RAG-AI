version: '3.8'
services:
  pgvector:
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  node-api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - pgvector
      - docling-service

  docling-service:
    build: ./services/docling-api
    ports:
      - "8000:8000"

volumes:
  pgvector-data:
